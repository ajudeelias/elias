name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare site for project URL
        run: |
          mkdir -p _site
          cp index.html load-diego-t7vn7.js _site/
          cp -R img vendor _site/
          python - <<'PY'
          from pathlib import Path
          page = Path("_site/index.html")
          html = page.read_text(encoding="utf-8")
          for asset in ("img/", "vendor/", "load-diego-t7vn7.js"):
              html = html.replace(f'="/{asset}', f'="{asset}')
          page.write_text(html, encoding="utf-8")
          PY
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
